name: CI

on:
  push:
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra checkpoint --extra simulation
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test offline suite
        run: uv run pytest -q -m "not e2e"
