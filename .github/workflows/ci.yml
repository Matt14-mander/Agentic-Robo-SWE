name: CI

on:
  push:
  pull_request:

jobs:
  workspace-isolation-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Set up Python
        run: uv python install 3.12
      - name: Install locked runtime and tests
        run: uv sync --frozen --extra dev --extra checkpoint
      - name: Build separate public runner and oracle images
        run: |
          docker build -t robo-phase70-runner -f examples/isolation/runner.Dockerfile examples/isolation
          docker build -t robo-phase70-oracle -f examples/isolation/oracle.Dockerfile examples/isolation
          echo "ROBO_TEST_RUNNER_IMAGE=$(docker image inspect robo-phase70-runner --format '{{.Id}}')" >> "$GITHUB_ENV"
          echo "ROBO_TEST_ORACLE_IMAGE=$(docker image inspect robo-phase70-oracle --format '{{.Id}}')" >> "$GITHUB_ENV"
      - name: Verify workspace, C++ semantics and real isolation
        run: |
          test -n "$ROBO_TEST_RUNNER_IMAGE"
          test -n "$ROBO_TEST_ORACLE_IMAGE"
          uv run pytest -q tests/test_workspaces.py tests/test_cpp_workspace.py tests/test_isolated_evaluation.py tests/test_repository_integration.py --junitxml=phase70-results.xml
      - name: Preserve architecture acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase70-architecture-results
          path: phase70-results.xml
          if-no-files-found: ignore

  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra checkpoint --extra simulation
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy src
      - name: Test offline suite
        run: uv run pytest -q -m "not e2e and not cpp"

  cpp-domain-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++
      - name: Set up Python
        run: uv python install 3.12
      - name: Install core and test dependencies
        run: uv sync --frozen --extra dev
      - name: Test Domain Pack contracts and CMake reference integration
        run: uv run pytest -q tests/test_domain_packs.py
      - name: Verify C++ benchmark fixture fails as designed
        run: uv run python scripts/run_benchmark.py --manifest benchmarks/cpp_cases.json --validate-fixtures
      - name: Check controlled robotics C++ broken/reference pairs
        run: uv run pytest -q tests/test_cpp_robotics.py -m cpp
      - name: Verify user-facing robotics fixture calibration
        run: uv run python scripts/check_cpp_robotics_fixtures.py

  autodiff-codegen-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install C++ toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ git libgtest-dev
      - name: Set up Python
        run: uv python install 3.12
      - name: Install core and test dependencies
        run: uv sync --frozen --extra dev
      - name: Restore pinned CppAD toolchain
        uses: actions/cache@v4
        with:
          path: .agent_state/domain_deps/autodiff_codegen/v1
          key: autodiff-codegen-linux-v1-67bdbf1b-656d23e3
      - name: Bootstrap pinned CppAD and CppADCodeGen
        run: uv run python scripts/bootstrap_autodiff_codegen.py
      - name: Run real source-to-CodeGen derivative gates
        run: uv run pytest -q tests/test_autodiff_codegen_pack.py tests/test_sparse_codegen.py -m autodiff_codegen
      - name: Verify all faulty fixtures are rejected
        run: uv run python scripts/run_benchmark.py --manifest benchmarks/autodiff_codegen_cases.json --validate-fixtures
      - name: Verify sparse dependency faults are rejected
        run: uv run python scripts/run_benchmark.py --manifest benchmarks/sparse_codegen_cases.json --validate-fixtures
      - name: Preserve derivative diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autodiff-correctness-diagnostics
          path: .agent_state/domain_artifacts/
          if-no-files-found: ignore

  pinocchio-rnea-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install native RNEA build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build g++ git pkg-config libgtest-dev libeigen3-dev liburdfdom-dev
          libboost-filesystem-dev libboost-serialization-dev libboost-system-dev
      - name: Set up Python
        run: uv python install 3.12
      - name: Install core and tests
        run: uv sync --frozen --extra dev
      - name: Bootstrap pinned automatic differentiation dependencies
        run: uv run python scripts/bootstrap_autodiff_codegen.py
      - name: Bootstrap pinned Pinocchio without Python/collision bindings
        run: uv run python scripts/bootstrap_pinocchio.py
      - name: Validate real RNEA, derivatives, CodeGen and source repairs
        run: uv run pytest -q tests/test_pinocchio_rnea.py -m pinocchio
      - name: Run sequential fresh-process RNEA control-loop benchmark
        run: uv run python scripts/run_pinocchio_control_loop.py --processes 3
      - name: Preserve RNEA evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinocchio-rnea-diagnostics
          path: .agent_state/domain_artifacts/
          if-no-files-found: ignore

  crocoddyl-mpc-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install native optimal-control build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake ninja-build g++ git pkg-config libgtest-dev libeigen3-dev liburdfdom-dev
          libboost-filesystem-dev libboost-serialization-dev libboost-system-dev libboost-test-dev
      - name: Set up Python
        run: uv python install 3.12
      - name: Install core and tests
        run: uv sync --frozen --extra dev
      - name: Bootstrap pinned native stack
        run: |
          uv run python scripts/bootstrap_autodiff_codegen.py
          uv run python scripts/bootstrap_pinocchio.py
          uv run python scripts/bootstrap_crocoddyl.py
      - name: Validate deterministic Crocoddyl solver-chain profile
        run: uv run pytest -q tests/test_crocoddyl_mpc.py tests/test_crocoddyl_robot_mpc.py -m crocoddyl
      - name: Run user-facing Phase 6.4 profile
        run: uv run python scripts/run_crocoddyl_mpc.py
      - name: Run real Pinocchio MPC cold/warm comparison
        run: uv run python scripts/run_crocoddyl_mpc.py --robot
      - name: Validate controlled CodeGen action replacement
        run: uv run pytest -q tests/test_crocoddyl_codegen_trial.py -m crocoddyl
      - name: Retest CodeGen across independent native processes
        run: uv run python scripts/run_crocoddyl_mpc.py --codegen --processes 3 --repeats 50
      - name: Preserve Crocoddyl evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crocoddyl-mpc-diagnostics
          path: .agent_state/domain_artifacts/crocoddyl_mpc/
          if-no-files-found: ignore
