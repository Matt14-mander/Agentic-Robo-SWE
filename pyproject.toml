[project]
name = "agentic-robo-swe"
version = "0.1.0"
description = "An autonomous, simulation-in-the-loop software engineering agent for robotics. Built with LangGraph."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "matt" }]
dependencies = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff",
    "mypy",
    "langgraph-cli[inmem]>=0.1.55",
]
# —— Phase 2+ 预留 ——
sandbox = ["e2b-code-interpreter>=2.7"]
rag = ["chromadb>=1.5,<2"]
checkpoint = ["langgraph-checkpoint-sqlite>=2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.hatch.build.targets.wheel.sources]
"src/agent" = "agent"

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end test requiring live LLM or sandbox API access",
]

[tool.ruff]
line-length = 100
target-version = "py311"
